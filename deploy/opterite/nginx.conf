map "$request_method:$uri" $opterite_backend_request {
    default 0;
    ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS):/(healthz|ssl-test|send-otp|logout|check-auth|auth/google(/callback)?|api/(app-config|patterns|system-health)|imap(/.*)?|campaign-lane(/.*)?|email-config|recipients|stop-sending|send-email|status|log-download|logs(/.*)?|logs-stats|files(/.*)?|files-stats)$ 1;
    ~^(POST|PUT|PATCH|DELETE|OPTIONS):/login$ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location / {
        if ($opterite_backend_request) {
            rewrite ^ /__opterite_api last;
        }

        try_files $uri $uri/ /index.html;
    }

    location = /__opterite_api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        internal;
        proxy_pass http://opterite-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }
}
