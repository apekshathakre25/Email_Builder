name: opterite

services:
  opterite-edge:
    image: opterite-edge:production
    build:
      context: .
      dockerfile: Dockerfile.edge
    init: true
    restart: unless-stopped
    depends_on:
      opterite-api:
        condition: service_healthy
    networks:
      - opterite-private
      - bulk-email-sender_default

  opterite-api:
    image: opterite-api:production
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "app.js"]
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://opterite-redis:6379
    expose:
      - "3000"
    depends_on:
      opterite-redis:
        condition: service_healthy
    volumes:
      - opterite-uploads:/app/backend/uploads
    networks:
      - opterite-private
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  opterite-worker:
    image: opterite-api:production
    command: ["node", "workprocess/mailer.js"]
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://opterite-redis:6379
    depends_on:
      opterite-redis:
        condition: service_healthy
    volumes:
      - opterite-uploads:/app/backend/uploads
    networks:
      - opterite-private

  opterite-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - opterite-redis-data:/data
    networks:
      - opterite-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  opterite-private:
    name: opterite-private
    driver: bridge
  bulk-email-sender_default:
    name: bulk-email-sender_default
    external: true

volumes:
  opterite-uploads:
    name: opterite-uploads
  opterite-redis-data:
    name: opterite-redis-data
