# Production stack for a single VPS (Contabo).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale worker=6
#
# Differences from docker-compose.yml (local dev):
#   * No mongo service — MONGODB_URI in .env points at MongoDB Atlas.
#   * Caddy terminates TLS on 80/443; the app is never published to the host.
#   * NODE_ENV is forced to production (secure cookies, strict secret checks).
#   * Container logs are size-capped so they cannot fill the VPS disk.

name: bulk-email-sender

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: bulk-email-sender:latest
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    # Overrides .env: production enables secure cookies and HSTS in app.js, and
    # makes config/env.js treat placeholder secrets as fatal instead of warnings.
    NODE_ENV: production
    # Redis lives on the compose network, not 127.0.0.1 as in local dev.
    REDIS_URL: redis://redis:6379
    # Caddy is the only hop in front of the app.
    TRUST_PROXY: "1"
  volumes:
    # The web app writes uploaded recipient files and the worker reads them back
    # by path, so both must see the same volume.
    - uploads:/app/uploads
    - logs:/app/logs
  depends_on:
    redis:
      condition: service_healthy
  logging: *logging

services:
  web:
    <<: *app
    command: ["node", "app.js"]
    # Deliberately no `ports:` — only Caddy is reachable from the internet, and
    # omitting a fixed host port is what allows `--scale web=N`.
    expose:
      - "3000"

  worker:
    <<: *app
    command: ["node", "workprocess/mailer.js"]
    # No HTTP listener here, so the image's curl /healthz probe cannot pass.
    # Bull redelivers jobs from a crashed worker; restart is the supervision.
    healthcheck:
      disable: true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # appendonly keeps queued jobs across a restart. Without it, restarting
    # Redis silently drops every pending send.
    #
    # maxmemory is a blast-radius guard, not a tuning knob. The host Redis ran
    # with no ceiling and grew to 8.36GB (4.6GB AOF), which made every restart
    # spend minutes in LOADING state and took the site down. Job retention is
    # now bounded in routes/sendemails.js, so 8GB should never be approached —
    # this exists so that if something unexpected does grow, Redis fails loudly
    # at 8GB instead of consuming all 62GB of host RAM.
    #
    # noeviction is deliberate: this is a work queue, not a cache. Evicting keys
    # would silently discard queued sends. At the ceiling, writes are refused,
    # so emailQueue.addBulk() throws and the request returns an error the
    # operator can see, rather than losing jobs quietly.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 8gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set these in .env, e.g.
      #   SITE_ADDRESS=opterite.com, www.opterite.com
      #   ACME_EMAIL=you@example.com
      # Compose reads .env from the project directory for this interpolation.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. opterite.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    # Caddy writes certs to a volume and reloads config without a restart:
    #   docker compose -f docker-compose.prod.yml exec caddy caddy reload --config /etc/caddy/Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the issued certificates and ACME account key. Losing it
      # means re-issuing certs and burning Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - web
    logging: *logging

volumes:
  uploads:
  logs:
  redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
