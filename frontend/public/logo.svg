<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Opterite">
  <title>Opterite</title>
  <defs>
    <linearGradient id="opterite-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="256" fill="url(#opterite-bg)" />

  <!-- "O" monogram drawn as an open orbit -->
  <circle cx="256" cy="256" r="118"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="44"
          stroke-linecap="round"
          stroke-dasharray="566 176"
          transform="rotate(-2.5 256 256)" />

  <!-- Orbiting accent dot -->
  <circle cx="363.5" cy="148.5" r="30" fill="#FFFFFF" />
</svg>
